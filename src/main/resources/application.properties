server.port=8080
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.application.name=ms-barriodigital-bff

azure.tenant-id=${AZURE_TENANT_ID:REPLACE_AZURE_TENANT_ID}
azure.api-client-id=${AZURE_API_CLIENT_ID:REPLACE_AZURE_CLIENT_ID}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${azure.tenant-id}/v2.0

services.requests.base-url=${REQUESTS_SERVICE_URL:http://127.0.0.1:8081}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.cl.duoc.ms_barriodigital_bff=${LOG_LEVEL_APP:INFO}
